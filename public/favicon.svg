<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Background Container -->
  <rect width="64" height="64" rx="16" fill="#09090B"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#F5C542" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Subtle Inner Glow Gradient -->
  <circle cx="32" cy="32" r="24" fill="#F5C542" fill-opacity="0.08"/>

  <!-- Iconic Geometric Z Logo Mark -->
  <path
    d="M 14 14 H 50 V 24 L 29 40 H 50 V 50 H 14 V 40 L 35 24 H 14 Z"
    fill="url(#goldGradient)"
  />

  <defs>
    <linearGradient id="goldGradient" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE072" />
      <stop offset="50%" stop-color="#F5C542" />
      <stop offset="100%" stop-color="#D99B16" />
    </linearGradient>
  </defs>
</svg>
